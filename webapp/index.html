<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<!-- viewport-fit=cover lets the app use the whole screen width and height (safe areas in style.css) -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Product Catalog - SAP Fiori Beginner</title>

	<!-- App icon: browser tab, and "Add to Home Screen" on phones -->
	<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
	<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
	<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
	<link rel="manifest" href="manifest.webmanifest">
	<meta name="theme-color" content="#0a4aa8">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Catalog">
	<!--
		"black-translucent": the blue header runs behind the iPhone status bar.
		This only fills the whole screen when the page itself scrolls (like a normal
		website), so style.css turns off UI5's fixed-height inner scrolling ("Page scrolls
		as a whole"). With "height: 100%" iOS stops one status-bar height short.
	-->
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

	<!--
		Step 1: Bootstrap SAPUI5 (the UI library behind SAP Fiori).
		We load OpenUI5 (the free, open-source version) from SAP's CDN,
		so no install is needed.
	-->
	<script
		id="sap-ui-bootstrap"
		src="https://sdk.openui5.org/1.148.0/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-libs="sap.m"
		data-sap-ui-compat-version="edge"
		data-sap-ui-async="true"
		data-sap-ui-resource-roots='{ "fiori.beginner.products": "./" }'
		data-sap-ui-on-init="module:sap/ui/core/ComponentSupport">
	</script>

	<script>
		// The whole page scrolls (see style.css), so:
		// 1. show the blue strip behind the status bar once the page is scrolled down
		window.addEventListener("scroll", function () {
			document.body.classList.toggle("isScrolled", window.scrollY > 8);
		}, { passive: true });
		// 2. open every page (list, product) at the top
		window.addEventListener("hashchange", function () {
			window.scrollTo(0, 0);
		});
	</script>
</head>

<!-- Step 2: The Component (Component.js) is started inside this div. -->
<body class="sapUiBody" id="content">
	<div
		data-sap-ui-component
		data-name="fiori.beginner.products"
		data-id="container"
		data-settings='{ "id": "products" }'>
	</div>
</body>
</html>
